<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Litvin - Ча ща</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; max-height: 100vh; background: #000; outline: none; }
    </style>
</head>
<body>
    <!-- muted и playsinline обязательны для автоплея на мобилках -->
    <video id="vid" controls playsinline autoplay muted loop src="litvin-cha-scha.mp4"></video>
    
    <script>
        // Принудительный запуск, если браузер затупил
        document.addEventListener("DOMContentLoaded", function() {
            var v = document.getElementById("vid");
            v.play().catch(function(error) {
                console.log("Браузер заблокировал автоплей, нужно нажать вручную.");
            });
        });
    </script>
</body>
</html>
